<!DOCTYPE html>
<html><head><base target="_top">
<style>body{font-family:sans-serif;padding:24px;max-width:480px;margin:auto}#out{margin-top:16px;font-size:18px;color:#1a7f37}</style>
</head><body>
  <h2>🧪 시험판 웹 페이지</h2>
  <p>로그인 없이 열리는 페이지입니다.</p>
  <div id="out">불러오는 중…</div>
<script>
google.script.run
  .withSuccessHandler(function(r){ document.getElementById('out').textContent = 'v' + r.version + ' · ' + r.message + ' (' + r.time + ')'; })
  .withFailureHandler(function(e){ document.getElementById('out').textContent = '오류: ' + e.message; })
  .getServerInfo('web');
</script>
</body></html>
